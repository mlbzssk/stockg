[project]
name = "stockg"
version = "0.1.0"
description = "A 股实时行情 + DeepSeek 大模型分析"
requires-python = ">=3.10"
dependencies = [
    "akshare==1.17.1",
    "openai",
    "pandas",
    "numpy",
    "requests",
    "httpx>=0.27.0",
    "pypdf",
    "python-dotenv>=1.0",
    "sentence-transformers",
    "chromadb",
    "langgraph",
    "truststore>=0.10.4",
    "langfuse>=4.14.2",
    "pytest-html>=4.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
stockg = "stockg.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stockg"]

[tool.uv]
system-certs = true

[dependency-groups]
dev = [
    "deepeval>=4.1.5",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
